name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: sos, POSTGRES_USER: sos, POSTGRES_DB: sos }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sos" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv python install && uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -rs --cov=app --cov-report=xml 2>&1 | tee pytest.out
        shell: bash
        env: { TEST_DATABASE_URL: postgresql://sos:sos@localhost:5432/sos, JEV_MODE: synthetic }
      - run: '! grep -qE "skipped|SKIPPED" pytest.out'
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with: { use_oidc: true, fail_ci_if_error: false, flags: backend, files: backend/coverage.xml }
  frontend:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: frontend/.nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx vitest run --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcov
      - run: npm run build
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with: { use_oidc: true, fail_ci_if_error: false, flags: frontend, files: frontend/coverage/lcov.info }
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: sos, POSTGRES_USER: sos, POSTGRES_DB: sos }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sos" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: frontend/.nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd backend && uv python install && uv sync --no-dev
      - run: |
          cd backend
          (PORT=8001 DATABASE_URL=postgresql://sos:sos@localhost:5432/sos SERVER_SECRET=ci JEV_MODE=synthetic CORS_ORIGINS=http://localhost:5190 uv run python -m app &)
          for i in $(seq 1 30); do
            curl -sf localhost:8001/api/health && exit 0
            sleep 2
          done
          echo "backend did not become healthy" >&2
          exit 1
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run e2e
  # Every push to main that passes the gates above publishes the image Coolify pulls; a pull
  # request only proves the image still builds.
  image:
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ferrum-citadel/shapes-of-stories:${{ github.sha }}
            ghcr.io/ferrum-citadel/shapes-of-stories:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
