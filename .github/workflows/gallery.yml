name: gallery
on:
  workflow_dispatch:
    inputs:
      only: { description: "space-separated slugs (empty = all)", required: false, default: "" }
permissions: {}
concurrency: { group: gallery, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: gallery
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: cd backend && uv python install && uv sync --no-dev
      - run: cd backend && uv run python -m app.cli gallery-build --mode live --list ../gallery/list.toml --out ../frontend/public/gallery --cache ../gallery/cache ${ONLY:+--only $ONLY}
        env: { TYPESAFE_API_KEY: "${{ secrets.TYPESAFE_API_KEY }}", ONLY: "${{ inputs.only }}" }
      - run: |
          date=$(date -u +%F)
          branch="gallery/$date"
          git config user.name "gallery-bot" && git config user.email "gallery-bot@users.noreply.github.com"
          git add frontend/public/gallery
          if git diff --cached --quiet; then echo "the stored works did not change"; exit 0; fi
          git switch -c "$branch"
          git commit -m "feat(gallery): rebuild the stored works ($date)"
          git push origin "$branch"
          body="Rebuilds every work in gallery/list.toml."
          if [ -n "$ONLY" ]; then body="Rebuilds only: $ONLY"; fi
          gh pr create --base main --head "$branch" --title "feat(gallery): rebuild the stored works ($date)" --body "$body"
        env: { GH_TOKEN: "${{ github.token }}", ONLY: "${{ inputs.only }}" }
