name: release
on: { release: { types: [published] } }
permissions: { contents: read }
jobs:
  # A published release is the image Coolify pulls; a pre-release moves no tag.
  image:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ferrum-citadel/shapes-of-stories:${{ github.event.release.tag_name }}
            ghcr.io/ferrum-citadel/shapes-of-stories:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      # Coolify sits behind Cloudflare Access: the service token passes Access, the Coolify token may only deploy.
      # curl -f would count Access's 302 login redirect as success, so require a 200.
      - name: Deploy on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code=$(curl -sS -m 60 -o resp.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.ferrum-citadel.dev/api/v1/deploy?uuid=y3bjw6fiopqlb4xaeb5mweqj&force=false")
          cat resp.json; echo
          [ "$code" = 200 ] || { echo "deploy request failed: HTTP $code" >&2; exit 1; }
