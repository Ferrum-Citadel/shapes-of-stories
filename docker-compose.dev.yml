# Development override: sources are mounted and reloaded instead of copied into the image.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Frontend with hot reload at http://localhost:5173 (API calls proxied to the app container).
services:
  app:
    command: ["uvicorn", "app.main:app_from_env", "--factory", "--reload", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    volumes: ["./backend/app:/app/app:ro"]
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000
  web:
    image: node:24-alpine
    working_dir: /web
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0 --port 5173"
    volumes: ["./frontend:/web", "web_modules:/web/node_modules"]
    ports: ["5173:5173"]
    environment:
      VITE_PROXY_TARGET: http://app:8000
      VITE_API_BASE: ""
    depends_on: [app]
volumes:
  web_modules:
