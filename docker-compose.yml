name: sos
services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://sos:sos@db:5432/sos
      SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET in .env}
      JEV_MODE: ${JEV_MODE:-synthetic}
      CORS_ORIGINS: http://localhost:8000
      STATIC_DIR: /app/static
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?FORWARDED_ALLOW_IPS must name the proxy address}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:18
    environment: { POSTGRES_USER: sos, POSTGRES_PASSWORD: sos, POSTGRES_DB: sos }
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sos"], interval: 5s, timeout: 3s, retries: 20 }
volumes:
  pgdata:
